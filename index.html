<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Apprendre le boulier japonais (soroban) et le calcul mental anzan en 9 étapes, avec des petits jeux.">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>L'école du boulier</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Grandstander:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  /* Mise en page : un cahier d'une colonne ; le boulier en bois est le héros, le parcours est une tige dont les étapes sont des perles */
  --paper:#ECF2ED; --surface:#FAFCFA; --tray:#F4EADA; --ink:#15302A; --muted:#4F6D66; --line:#C8D9CF;
  --jade:#16785A; --jade-ink:#FFFFFF; --jade-soft:#D5EBE0; --hl:rgba(22,120,90,.14);
  --wood:#6A3C1E; --wood-hi:#8F5C36; --rod:#C9AE84;
  --sky:#D23B2A; --sky-hi:#F2826A; --sky-lo:#8C2013;
  --earth:#E59E33; --earth-hi:#F9D488; --earth-lo:#A5620F;
  --good:#1D8752; --bad:#BD3A2C; --screen-bg:#15302A; --screen-fg:#ECF2ED;
  --f-display:"Grandstander","Trebuchet MS",system-ui,sans-serif;
  --f-body:"Atkinson Hyperlegible","Segoe UI",system-ui,-apple-system,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#0E1815; --surface:#15221E; --tray:#2B2219; --ink:#E2EEE8; --muted:#97B1A7; --line:#2A3C35;
    --jade:#4DC497; --jade-ink:#08201A; --jade-soft:#1B372D; --hl:rgba(77,196,151,.16);
    --wood:#55301A; --wood-hi:#7A4C2B; --rod:#A68C63;
    --sky:#E0503B; --sky-hi:#F59A84; --sky-lo:#8E2416;
    --earth:#E8A63E; --earth-hi:#FADB97; --earth-lo:#9C5C10;
    --good:#55C98F; --bad:#F27466; --screen-bg:#060C0A; --screen-fg:#E2EEE8; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#0E1815; --surface:#15221E; --tray:#2B2219; --ink:#E2EEE8; --muted:#97B1A7; --line:#2A3C35;
  --jade:#4DC497; --jade-ink:#08201A; --jade-soft:#1B372D; --hl:rgba(77,196,151,.16);
  --wood:#55301A; --wood-hi:#7A4C2B; --rod:#A68C63;
  --sky:#E0503B; --sky-hi:#F59A84; --sky-lo:#8E2416;
  --earth:#E8A63E; --earth-hi:#FADB97; --earth-lo:#9C5C10;
  --good:#55C98F; --bad:#F27466; --screen-bg:#060C0A; --screen-fg:#E2EEE8; color-scheme:dark;
}
*{box-sizing:border-box}
body{
  background:var(--paper); color:var(--ink);
  font-family:var(--f-body); font-size:17px; line-height:1.55;
  padding-left:max(16px, env(safe-area-inset-left, 0px));
  padding-right:max(16px, env(safe-area-inset-right, 0px));
  padding-block:0 56px;
}
.wrap{max-width:1040px; margin:0 auto}
.col{max-width:780px; margin:0 auto}
h1,h2,h3{font-family:var(--f-display); text-wrap:balance; margin:0; line-height:1.1}
p{margin:0}
b{font-weight:700}
button{font:inherit; color:inherit}
:focus-visible{outline:3px solid var(--jade); outline-offset:2px}

/* ---------- haut de page ---------- */
.top{display:flex; align-items:center; justify-content:space-between; gap:12px; padding-block:8px 18px}
.home-projects{display:inline-block; margin-top:14px; font-weight:700; font-size:.9rem; color:var(--muted); text-decoration:none}
.home-projects:hover{color:var(--jade)}
.brand{display:flex; align-items:center; gap:10px; background:none; border:0; padding:4px 0; cursor:pointer; font:700 1.15rem var(--f-display); color:var(--ink)}
.total{display:flex; align-items:center; gap:6px; font:700 .95rem var(--f-body); color:var(--muted); font-variant-numeric:tabular-nums}
.total .star{width:18px; height:18px}

.bead-ico{display:inline-block; width:30px; height:17px; flex:none;
  clip-path:polygon(0 50%, 30% 0, 70% 0, 100% 50%, 70% 100%, 30% 100%);
  background:linear-gradient(180deg, var(--earth-hi), var(--earth) 52%, var(--earth-lo))}
.bead-ico.sky{background:linear-gradient(180deg, var(--sky-hi), var(--sky) 52%, var(--sky-lo))}

/* ---------- joueurs (sauvegardes) ---------- */
.players{display:grid; gap:10px; margin-top:26px}
.players h2{font-size:1.45rem}
.players .hintline{color:var(--muted); font-size:.95rem}
.pgrid{display:grid; grid-template-columns:repeat(auto-fill, minmax(136px, 1fr)); gap:8px}
.pbtn{cursor:pointer; display:grid; grid-template-columns:auto minmax(0,1fr); align-items:center; gap:10px; text-align:left;
  padding:8px 10px; border-radius:16px; border:2px solid var(--line); background:var(--surface)}
.pbtn:hover{border-color:var(--jade)}
.pbtn[aria-pressed="true"]{border-color:var(--jade); background:var(--jade-soft)}
.pbead{width:42px; height:25px; display:grid; place-items:center; flex:none; font:800 1rem var(--f-display); color:#3A2205;
  clip-path:polygon(0 50%, 28% 0, 72% 0, 100% 50%, 72% 100%, 28% 100%);
  background:linear-gradient(180deg, var(--earth-hi), var(--earth) 52%, var(--earth-lo))}
.alt .pbead, .pbead.alt{background:linear-gradient(180deg, var(--sky-hi), var(--sky) 52%, var(--sky-lo)); color:#fff}
.pname{font:700 1.08rem var(--f-display); display:block; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.pstat{font-size:.82rem; color:var(--muted); display:block; font-variant-numeric:tabular-nums; white-space:nowrap}
.who-btn{cursor:pointer; display:flex; align-items:center; gap:8px; border:2px solid var(--line); border-radius:999px; padding:5px 12px 5px 6px; background:var(--surface); font:700 .95rem var(--f-body)}
.who-btn:hover{border-color:var(--jade)}
.who-btn .pbead{width:34px; height:20px; font-size:.85rem}
.who-btn .total{margin-left:4px}
.lstep{display:flex; gap:2px; flex-wrap:wrap; align-items:center}
.lstep button{background:none; border:0; padding:3px; cursor:pointer; border-radius:8px}
.lstep span{display:grid; place-items:center; width:38px; height:23px; font:800 .85rem var(--f-display); color:var(--ink); background:var(--line);
  clip-path:polygon(0 50%, 28% 0, 72% 0, 100% 50%, 72% 100%, 28% 100%)}
.lstep button.done span{background:linear-gradient(180deg, var(--sky-hi), var(--sky) 52%, var(--sky-lo)); color:#fff}
.lstep button[aria-current="step"] span{background:var(--ink); color:var(--paper)}
.here{font:700 .72rem var(--f-body); letter-spacing:.1em; text-transform:uppercase; color:var(--jade); display:block; margin-bottom:2px}
.notice{display:grid; gap:10px; background:var(--surface); border:2px dashed var(--line); border-radius:18px; padding:14px 16px}
.stage .legend{margin:0; gap:8px; font-size:.92rem}
.stage .legend .bead-ico{width:30px; height:17px}
.stage .legend .rule-ico{width:30px}

/* ---------- héros ---------- */
.hero{display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr); gap:44px; align-items:center; padding-block:18px 56px}
.eyebrow{font:700 .78rem var(--f-body); letter-spacing:.12em; text-transform:uppercase; color:var(--jade)}
.hero h1{font-weight:800; font-size:clamp(2.6rem, 6.4vw, 4.4rem); letter-spacing:-.01em; margin-top:10px}
.lead{font-size:1.16rem; margin-top:18px; max-width:44ch}
.legend{list-style:none; padding:0; margin:26px 0 0; display:grid; gap:12px}
.legend li{display:flex; align-items:center; gap:12px}
.legend .bead-ico{width:36px; height:20px}
.legend .rule-ico{width:36px; height:8px; border-radius:2px; background:var(--wood); flex:none}
.stage{background:var(--surface); border:1px solid var(--line); border-radius:26px; padding:22px 22px 18px; display:grid; gap:14px}
.readout{display:flex; align-items:baseline; justify-content:space-between; gap:12px}
.readout .num{font:800 3rem/1 var(--f-display); font-variant-numeric:tabular-nums}
.readout .cap{font-size:.9rem; color:var(--muted); text-align:right}
.btns{display:flex; flex-wrap:wrap; gap:10px; align-items:center}
.small-note{font-size:.88rem; color:var(--muted)}

/* ---------- boutons ---------- */
.btn{cursor:pointer; border-radius:999px; padding:10px 18px; font-weight:700; font-size:1rem;
  background:transparent; border:2px solid var(--line); color:var(--ink); transition:border-color .15s, background .15s}
.btn:hover{border-color:var(--jade)}
.btn.primary{background:var(--jade); border-color:var(--jade); color:var(--jade-ink)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.ghost{border-color:transparent; color:var(--muted)}
.btn.ghost:hover{color:var(--ink); border-color:var(--line)}
.btn:disabled{opacity:.45; cursor:default}

/* ---------- parcours ---------- */
.path h2{font-size:clamp(1.7rem, 3.6vw, 2.3rem)}
.path .sub{color:var(--muted); margin-top:6px}
.steps{list-style:none; padding:0; margin:24px 0 0; position:relative; display:grid; gap:6px}
.steps::before{content:""; position:absolute; left:30px; top:24px; bottom:24px; width:4px; border-radius:2px; background:var(--rod)}
.step{width:100%; display:grid; grid-template-columns:64px minmax(0,1fr) auto; gap:16px; align-items:center; text-align:left;
  background:transparent; border:0; border-radius:18px; padding:12px 14px 12px 0; cursor:pointer; position:relative}
.step:hover{background:var(--surface)}
.step-bead{width:64px; height:38px; display:grid; place-items:center; font:800 1.15rem var(--f-display); color:#3A2205;
  clip-path:polygon(0 50%, 28% 0, 72% 0, 100% 50%, 72% 100%, 28% 100%);
  background:linear-gradient(180deg, var(--earth-hi), var(--earth) 52%, var(--earth-lo))}
.step.done .step-bead{background:linear-gradient(180deg, var(--sky-hi), var(--sky) 52%, var(--sky-lo)); color:#fff}
.step-title{font:700 1.22rem var(--f-display); display:block}
.step-desc{color:var(--muted); font-size:.95rem; display:block; margin-top:2px}
.stars{display:inline-flex; gap:2px; align-items:center}
.star{width:20px; height:20px; display:block}
.star path{fill:var(--line)}
.star.on path{fill:var(--earth)}
.stars.lg .star{width:44px; height:44px}

.facts{display:grid; grid-template-columns:repeat(3, minmax(0,1fr)); gap:28px; margin-top:56px; padding-top:28px; border-top:2px solid var(--line)}

/* ---------- rythme des écoles d'Asie ---------- */
.pace{margin-top:56px; display:grid; gap:14px}
.pace h2{font-size:clamp(1.5rem, 3.2vw, 2rem)}
.pace .sub{color:var(--muted); max-width:65ch}
.tl-fig{display:grid; gap:14px}
.tl-legend{display:flex; flex-wrap:wrap; gap:8px 20px; font-size:.88rem; color:var(--muted)}
.tl-legend span{display:inline-flex; align-items:center; gap:8px}
.tl-legend i{display:inline-block; width:26px; height:10px; border-radius:5px}
.tl-legend i.fast, .tl-bar.fast{background:var(--jade)}
.tl-legend i.slow, .tl-bar.slow{background:transparent; border:2px solid var(--earth)}
.tl{display:grid; gap:12px}
.tl-row{display:grid; grid-template-columns:minmax(0,15rem) minmax(0,1fr); gap:6px 16px; align-items:center}
.tl-label{display:grid; font-size:.9rem; line-height:1.3}
.tl-label span{color:var(--muted); font-size:.8rem}
.tl-track{position:relative; height:30px; border-left:2px solid var(--line); background:linear-gradient(var(--line), var(--line)) 0 50%/100% 1px no-repeat}
.tl-bar{position:absolute; border-radius:6px; min-width:6px}
.tl-bar.fast{top:3px; height:11px}
.tl-bar.slow{top:16px; height:11px}
.tl-axis{position:relative; height:20px; border-left:2px solid transparent}
.tl-tick{position:absolute; top:0; transform:translateX(-50%); font-size:.75rem; color:var(--muted); white-space:nowrap; font-variant-numeric:tabular-nums}
.tl-tick:first-child{transform:none}
.tl-tick:last-child{transform:translateX(-100%)}
.tl-pins{position:relative; border-left:2px solid var(--line)}
.tl-pin{position:absolute; transform:translateX(-50%); width:34px; height:21px; display:grid; place-items:center; font:800 .8rem var(--f-display); color:#3A2205;
  clip-path:polygon(0 50%, 28% 0, 72% 0, 100% 50%, 72% 100%, 28% 100%);
  background:linear-gradient(180deg, var(--earth-hi), var(--earth) 52%, var(--earth-lo))}
.tl-pin.alt{background:linear-gradient(180deg, var(--sky-hi), var(--sky) 52%, var(--sky-lo)); color:#fff}
.tl-who{list-style:none; margin:0; padding:10px 0 0; border-top:1px solid var(--line); display:grid; gap:8px; font-size:.92rem}
.tl-who li{display:flex; align-items:center; gap:10px}
.tl-who .pbead{width:34px; height:20px; font-size:.8rem}
.pace-notes{display:grid; grid-template-columns:repeat(3, minmax(0,1fr)); gap:24px; margin-top:8px}
.pace-notes h3{font-size:1.1rem; margin-bottom:6px}
.pace-notes p{font-size:.95rem; color:var(--muted)}
.asia{display:flex; gap:12px; align-items:flex-start; background:var(--surface); border:1px solid var(--line); border-radius:16px; padding:12px 16px; max-width:65ch}
.asia-ico{flex:none; width:22px; height:22px; margin-top:2px}
.asia-ico circle, .asia-ico path{fill:none; stroke:var(--jade); stroke-width:2; stroke-linecap:round}
.asia-label{font-weight:700}
@media (max-width: 520px){ .tl-tick-minor{display:none} }
@media (max-width: 820px){
  .tl-row{grid-template-columns:minmax(0,1fr)}
  .tl-axis-row .tl-label{display:none}
  .pace-notes{grid-template-columns:minmax(0,1fr); gap:16px}
}
.facts h3{font-size:1.15rem; margin-bottom:8px}
.facts p{font-size:.97rem; color:var(--muted)}
.facts p b{color:var(--ink)}

/* ---------- leçon ---------- */
.lesson{display:flex; flex-direction:column; gap:34px; padding-top:6px}
.lesson-nav{display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap}
.lesson-head h1{font-weight:800; font-size:clamp(2.1rem, 5vw, 3.1rem); margin-top:8px}
.lesson-head .lead{max-width:56ch}
.block{display:flex; flex-direction:column; gap:14px}
.block > p{max-width:65ch}
.h2{font-size:1.55rem}
.rule{background:var(--jade-soft); border-radius:18px; padding:16px 20px; display:grid; gap:4px; max-width:65ch}
.rule-label{font:700 .75rem var(--f-body); letter-spacing:.12em; text-transform:uppercase; color:var(--jade)}
.fig{background:var(--surface); border:1px solid var(--line); border-radius:22px; padding:18px}
.explorer{display:grid; grid-template-columns:auto minmax(0,1fr); gap:22px; align-items:center}
.explorer .big{font:800 4.2rem/1 var(--f-display); font-variant-numeric:tabular-nums}
.explorer .cap{color:var(--muted); min-height:3em; margin-top:6px}
.choices{display:grid; grid-template-columns:repeat(5, minmax(0,1fr)); gap:8px; width:100%; max-width:360px}
.choice{cursor:pointer; border:2px solid var(--line); background:var(--surface); border-radius:14px; padding:8px 0; font:800 1.4rem var(--f-display); font-variant-numeric:tabular-nums}
.choice:hover{border-color:var(--jade)}
.choice.on{background:var(--jade); border-color:var(--jade); color:var(--jade-ink)}
.choice.wrong{border-color:var(--bad); color:var(--bad); opacity:.6}
.choice.right{background:var(--good); border-color:var(--good); color:#fff}
.chips{display:flex; flex-wrap:wrap; gap:8px}
.chip{cursor:pointer; border:2px solid var(--line); background:transparent; border-radius:999px; padding:6px 14px; font:700 1rem var(--f-display); font-variant-numeric:tabular-nums}
.chip[aria-pressed="true"]{background:var(--ink); border-color:var(--ink); color:var(--paper)}
.table{border-collapse:collapse; font-variant-numeric:tabular-nums; min-width:300px}
.table th,.table td{text-align:left; padding:8px 16px 8px 0; border-bottom:1px solid var(--line)}
.table th{font:700 .78rem var(--f-body); letter-spacing:.08em; text-transform:uppercase; color:var(--muted)}
.table td:first-child{font:700 1.1rem var(--f-display)}
.scroll{overflow-x:auto}
.pairs{display:grid; gap:10px}
.pair{display:flex; align-items:center; gap:14px; flex-wrap:wrap}
.dots{display:inline-flex; gap:5px; align-items:center}
.dots .gap{width:8px}
.dot{width:24px; height:14px; clip-path:polygon(0 50%, 28% 0, 72% 0, 100% 50%, 72% 100%, 28% 100%); background:var(--line)}
.dot.a{background:linear-gradient(180deg, var(--earth-hi), var(--earth) 52%, var(--earth-lo))}
.dot.b{background:linear-gradient(180deg, var(--sky-hi), var(--sky) 52%, var(--sky-lo))}
.pair-label{font:700 1.1rem var(--f-display)}
.howto{margin:0; padding-left:1.4em; display:grid; gap:8px; max-width:65ch}
.lesson-foot{display:flex; justify-content:space-between; gap:12px; flex-wrap:wrap; padding-top:12px; border-top:2px solid var(--line)}

/* ---------- démo ---------- */
.demo{display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1.15fr); gap:22px; align-items:start}
.demo-side{display:flex; flex-direction:column; gap:14px; min-width:0}
.problem{display:flex; flex-wrap:wrap; align-items:baseline; gap:.32em; font:800 2.6rem/1.1 var(--f-display); font-variant-numeric:tabular-nums}
.problem.sm{font-size:2rem}
.problem .op{color:var(--muted)}
.problem .ans{color:var(--muted)}
.problem .ans.ok{color:var(--good)}
.plan{list-style:none; margin:0; padding:0; display:grid; gap:8px; counter-reset:st}
.plan li{counter-increment:st; position:relative; padding:10px 12px 10px 46px; border-radius:14px; background:transparent; border:1px solid var(--line); font-size:.97rem}
.plan li::before{content:counter(st); position:absolute; left:12px; top:10px; width:24px; height:24px; border-radius:50%; display:grid; place-items:center; background:var(--line); font:700 .85rem var(--f-body)}
.plan li.sub{margin-left:22px}
.plan li.active{background:var(--hl); border-color:var(--jade)}
.plan li.active::before{background:var(--jade); color:var(--jade-ink)}
.plan li.done{opacity:.7}
.mvs{display:flex; gap:6px; margin-top:6px; flex-wrap:wrap}
.mv{font:700 .85rem var(--f-body); padding:2px 10px; border-radius:999px; border:1.5px solid var(--line); color:var(--muted); font-variant-numeric:tabular-nums}
.mv.on{background:var(--ink); border-color:var(--ink); color:var(--paper)}

/* ---------- jeux ---------- */
.game{background:var(--surface); border:2px solid var(--line); border-radius:26px; padding:22px; display:grid; gap:16px}
.game-head{display:flex; justify-content:space-between; align-items:flex-start; gap:14px; flex-wrap:wrap}
.game-title{font-size:1.6rem; margin-top:4px}
.game-intro{color:var(--muted); max-width:62ch}
.game-prog{display:flex; flex-direction:column; align-items:flex-end; gap:6px}
.pbeads{display:flex; gap:3px}
.pbeads span{width:18px; height:11px; clip-path:polygon(0 50%, 28% 0, 72% 0, 100% 50%, 72% 100%, 28% 100%); background:var(--line)}
.pbeads span.ok{background:var(--jade)}
.pbeads span.miss{background:var(--earth)}
.pbeads span.cur{background:var(--ink)}
.pcount{font:700 .85rem var(--f-body); color:var(--muted); font-variant-numeric:tabular-nums}
.game-body{display:grid; gap:16px; justify-items:start; min-width:0}
.game-body > *{max-width:100%}
.ask{font-size:1.2rem}
.ask .num{font:800 2.2rem var(--f-display); font-variant-numeric:tabular-nums; vertical-align:-.1em; padding:0 .1em}
.ask.small{font-size:1rem; color:var(--muted)}
.fb{min-height:1.6em; font-weight:700}
.fb.good{color:var(--good)}
.fb.bad{color:var(--bad)}
.sb-host{width:100%; position:relative}
.round-grid{display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr); gap:22px; align-items:start; width:100%}
.round-side{display:grid; gap:14px; min-width:0}
.summary{display:grid; gap:12px; justify-items:start; padding:10px 0}
.sum-big{font:800 1.8rem var(--f-display)}
.muted{color:var(--muted)}
.shake{animation:shake .35s}
@keyframes shake{20%{transform:translateX(-6px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(3px)}}
.curtain{position:absolute; inset:0; display:grid; place-items:center; background:var(--surface); border-radius:16px; border:2px dashed var(--line); font:800 2.4rem var(--f-display); color:var(--muted); transition:opacity .15s}
.curtain[hidden]{display:none}

.keypad{display:grid; gap:10px; width:100%; max-width:300px}
.keypad.off{opacity:.45; pointer-events:none}
.kp-label{font:700 .78rem var(--f-body); letter-spacing:.1em; text-transform:uppercase; color:var(--muted)}
.kp-display{font:800 2.2rem/1 var(--f-display); font-variant-numeric:tabular-nums; border-bottom:3px solid var(--ink); padding:6px 4px 8px; min-height:1.6em}
.kp-display.empty{color:var(--line)}
.kp-grid{display:grid; grid-template-columns:repeat(3, minmax(0,1fr)); gap:8px}
.kp-key{cursor:pointer; border:2px solid var(--line); background:var(--paper); border-radius:14px; padding:10px 0; font:800 1.35rem var(--f-display)}
.kp-key:hover{border-color:var(--jade)}
.kp-key.ok{background:var(--jade); border-color:var(--jade); color:var(--jade-ink); font-size:1.05rem}
.kp-key.del{font-size:1.1rem}

.flash-set{display:flex; flex-wrap:wrap; gap:14px 24px}
.seg{display:grid; gap:6px}
.seg-label{font:700 .78rem var(--f-body); letter-spacing:.1em; text-transform:uppercase; color:var(--muted)}
.flash-screen{width:100%; min-height:190px; display:grid; place-items:center; border-radius:20px; background:var(--screen-bg); color:var(--screen-fg); border:1px solid var(--line)}
.flash-num{font:800 clamp(4rem, 14vw, 6.5rem)/1 var(--f-display); font-variant-numeric:tabular-nums}
.flash-num.count{font-size:2.4rem; opacity:.6}
.flash-num.msg{font-size:2rem}
.flash-row{display:grid; grid-template-columns:minmax(0,1fr) auto; gap:22px; width:100%; align-items:start}
.practice-host:empty{display:none}
.qrow{font:800 1.5rem var(--f-display); font-variant-numeric:tabular-nums}
.flash-num.neg{color:var(--sky-hi)}
.defi{border-color:var(--earth)}
.defi-status{display:flex; flex-wrap:wrap; align-items:center; gap:10px 14px}
.defi-beads span{width:30px; height:18px}
.lock-ico{width:1em; height:1em; vertical-align:-.12em}
.lock-ico rect, .lock-ico path{fill:none; stroke:currentColor; stroke-width:2; stroke-linecap:round}
.step.locked .step-bead{filter:grayscale(1); opacity:.55}
.step.locked .step-title{color:var(--muted)}
.lstep button.locked span{opacity:.45}
.lockbox{display:grid; gap:12px; justify-items:start; background:var(--surface); border:2px dashed var(--line); border-radius:22px; padding:22px}
.lockbox > .lock-ico{width:34px; height:34px; color:var(--muted)}
.qdigits{letter-spacing:.12em; color:var(--jade)}
.practice{display:grid; gap:12px; padding-top:18px; border-top:2px dashed var(--line)}
.practice-title{font-size:1.35rem}
.mv.big{font-size:1rem; padding:4px 12px}
.mv.cur{border-color:var(--ink); color:var(--ink)}
.run-total{font-weight:700}

/* ---------- boulier (SVG) ---------- */
.sb-svg{display:block; width:100%; height:auto; margin:0 auto; touch-action:manipulation; -webkit-tap-highlight-color:transparent; user-select:none; -webkit-user-select:none}
.sb-frame{fill:var(--wood)}
.sb-tray{fill:var(--tray)}
.sb-rod{stroke:var(--rod); stroke-width:3.5; stroke-linecap:round}
.sb-beam{fill:var(--wood)}
.sb-dot{fill:var(--tray)}
.sb-hl{fill:var(--hl); opacity:0; transition:opacity .2s}
.sb-hl.on{opacity:1}
.sb-hl.focus{opacity:1; stroke:var(--jade); stroke-width:2.5}
.sb-col{outline:none}
.sb-bead{transition:transform .2s cubic-bezier(.34,1.3,.5,1)}
.sb-svg.live .sb-bead{cursor:pointer}
.sb-svg.live.locked .sb-bead{cursor:default}
.sb-svg.live:not(.locked) .sb-bead:hover .sb-bead-body{filter:brightness(1.1)}
.sb-bead-body{stroke-width:1.5; stroke-linejoin:round}
.sky .sb-bead-body{fill:url(#gSky); stroke:var(--sky-lo)}
.earth .sb-bead-body{fill:url(#gEarth); stroke:var(--earth-lo)}
.sb-bead-ridge{stroke:rgba(0,0,0,.2); stroke-width:1}
.sb-bead-shine{fill:rgba(255,255,255,.5)}
.sb-digit{font:800 21px var(--f-display); fill:var(--ink)}
.sb-place{font:700 12px var(--f-body); fill:var(--muted); letter-spacing:.06em}
.sb-svg.no-digits .sb-digit{visibility:hidden}
.sb-annot text{font:13px var(--f-body); fill:var(--ink)}
.sb-annot text.b{font-weight:700; font-size:14px}
.sb-annot line{stroke:var(--muted); stroke-width:1.2; stroke-dasharray:3 3}

@media (max-width: 820px){
  .hero{grid-template-columns:minmax(0,1fr); gap:28px; padding-block:6px 40px}

  .step{grid-template-columns:64px minmax(0,1fr); padding-right:6px}
  .step .stars{grid-column:2}
  .problem{font-size:2.1rem}
}
@media (prefers-reduced-motion: reduce){
  .sb-bead,.sb-hl,.btn{transition:none}
  .shake{animation:none}
}

<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">

    </linearGradient>
  </defs>
</svg>

<div class="wrap">
  <a class="home-projects" href="https://esperidad-tech.github.io/">← Tous mes projets</a>
  <header class="top">
    <button class="brand" id="brand" type="button" aria-label="Retour au parcours"><span class="bead-ico sky"></span>L'école du boulier</button>
    <div id="who"></div>
  </header>
  <main id="view"></main>
</div>

<script>
/* =========================================================
   Outils
   ========================================================= */
const MINUS = '−';
const PLACE = ['u','d','c','m','dm','cm'];
const PLACE_LONG = ['unités','dizaines','centaines','milliers','dizaines de mille','centaines de mille'];
const $ = (s, r=document) => r.querySelector(s);
const wait = ms => new Promise(r => setTimeout(r, ms));
const rand = (a,b) => a + Math.floor(Math.random()*(b-a+1));
const shuffle = arr => { const a=[...arr]; for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; };
const plural = (n,w) => `${n} ${w}${n>1?'s':''}`;
const cap = s => s.charAt(0).toUpperCase()+s.slice(1);
const fmt = n => Number(n).toLocaleString('fr-FR');
const fr = s => String(s).replace(/ ([!?;:»])/g, ' $1').replace(/« /g, '« ');

function h(tag, attrs, ...kids){
  const el = document.createElement(tag);
  if (attrs) for (const [k,v] of Object.entries(attrs)){
    if (v==null || v===false) continue;
    if (k==='class') el.className = v;
    else if (k==='html') el.innerHTML = fr(v);
    else if (k.startsWith('on') && typeof v==='function') el.addEventListener(k.slice(2), v);
    else el.setAttribute(k, v===true ? '' : v);
  }
  for (const c of kids.flat(Infinity)){
    if (c==null || c===false || c==='') continue;
    el.append(typeof c==='string' || typeof c==='number' ? fr(String(c)) : c);
  }
  return el;
}
const SVGNS = 'http://www.w3.org/2000/svg';
function s(tag, attrs={}){ const el=document.createElementNS(SVGNS, tag); for (const k in attrs) el.setAttribute(k, attrs[k]); return el; }

const STAR_D = 'M12 2.6l2.9 6 6.6.9-4.8 4.6 1.2 6.5L12 17.5l-5.9 3.1 1.2-6.5L2.5 9.5l6.6-.9z';
function svgStar(on){ const sv=s('svg',{viewBox:'0 0 24 24', class: on?'star on':'star', 'aria-hidden':'true'}); sv.append(s('path',{d:STAR_D})); return sv; }
function starRow(n, size=''){ return h('span',{class:'stars '+size, role:'img', 'aria-label':`${n} étoile${n>1?'s':''} sur 3`}, [0,1,2].map(i=>svgStar(i<n))); }

/* Joueurs : chaque prénom est une sauvegarde (gardée dans ce navigateur) */
const PLAYERS = [
  {id:'romain', name:'Romain'}, {id:'siham', name:'Siham'}, {id:'lia', name:'Lia'}, {id:'naim', name:'Naïm'}, {id:'alicia', name:'Alicia'},
  {id:'ertan', name:'Ertan'}, {id:'eline', name:'Eline'}, {id:'aurelie', name:'Aurélie'}, {id:'mimi', name:'Mimi'}, {id:'millou', name:'Millou'}
];
const Store = {
  key:'ecole-boulier-v2', data:null,
  load(){
    if (this.data) return this.data;
    let d = null;
    try { d = JSON.parse(localStorage.getItem(this.key)); } catch(e){}
    this.data = d && d.players ? d : {current:null, players:{}};
    if (this.data.current && !PLAYERS.some(p => p.id===this.data.current)) this.data.current = null;
    return this.data;
  },
  save(){ try { localStorage.setItem(this.key, JSON.stringify(this.data)); } catch(e){} },
  cur(){ return this.load().current; },
  player(id=this.cur()){ if (!id) return null; const d=this.load(); return d.players[id] || (d.players[id] = {stars:{}, games:{}, lesson:null, scroll:0}); },
  peek(id){ return this.load().players[id] || null; },
  setCurrent(id){ this.load().current = id; this.player(id); this.save(); },
  stars(lid, id=this.cur()){ const p = id ? this.peek(id) : null; return p ? (p.stars[lid]||0) : 0; },
  setStars(lid, n){ const p=this.player(); if (!p) return; p.stars[lid] = Math.max(p.stars[lid]||0, n); this.save(); },
  total(id){ const p=this.peek(id); return p ? LESSONS.reduce((sum,l) => sum + (p.stars[l.id]||0), 0) : 0; },
  game(key){ const p=this.player(); return p ? (p.games[key] || null) : null; },
  defi(){ const p=this.player(); return p ? (p.defi || (p.defi = {streak:0, done:false})) : null; },
  defiDone(id=this.cur()){ const p = id ? this.peek(id) : null; return !!(p && p.defi && p.defi.done); },
  setGame(key, v){ const p=this.player(); if (!p) return; if (v) p.games[key] = v; else delete p.games[key]; this.save(); }
};

/* =========================================================
   Le boulier (soroban : 1 perle du ciel, 4 perles de la terre)
   ========================================================= */
const G = { RG:60, BW:50, BH:26, F:15, PX:12, B:12 };
G.HZ = G.BH*2 + 8; G.EZ = G.BH*5 + 8; G.T = G.BH + 3;
const BEAD_D = (() => { const w=G.BW, hh=G.BH, k=hh*.62; return `M${-w/2} 0 L${-w/2+k} ${-hh/2} L${w/2-k} ${-hh/2} L${w/2} 0 L${w/2-k} ${hh/2} L${-w/2+k} ${hh/2} Z`; })();

class Soroban {
  constructor(host, o={}){
    this.n = o.rods || 3;
    this.interactive = o.interactive !== false;
    this.showDigits = o.digits !== false;
    this.labels = o.labels !== false;
    this.annot = !!o.annotate;
    this.onChange = o.onChange || null;
    this.locked = false;
    this.st = Array.from({length:this.n}, () => ({h:0, e:0}));
    this.host = host;
    this.build(o.scale || 1.2);
    if (o.value != null) this.setValue(o.value);
  }
  x(i){ return G.F + G.PX + G.RG/2 + (this.n-1-i)*G.RG; }
  build(scale){
    const n=this.n, W = G.F*2 + G.PX*2 + G.RG*n;
    const beamY = G.F + G.HZ, bottomY = beamY + G.B + G.EZ, H = bottomY + G.F;
    const LH = this.annot ? 0 : 46, AW = this.annot ? 196 : 0;
    const svg = s('svg', {viewBox:`0 0 ${W+AW} ${H+LH}`, class:'sb-svg' + (this.interactive?' live':''), role: this.interactive ? 'group' : 'img'});
    svg.setAttribute('aria-label', this.interactive ? 'Boulier : clique sur les perles' : 'Boulier');
    svg.style.maxWidth = Math.round((W+AW)*scale) + 'px';
    svg.append(s('rect',{x:0, y:0, width:W, height:H, rx:12, class:'sb-frame'}));
    svg.append(s('rect',{x:G.F, y:G.F, width:W-2*G.F, height:H-2*G.F, rx:4, class:'sb-tray'}));
    this.hl=[]; this.cols=[]; this.beads=[]; this.digitEls=[];
    for (let i=0;i<n;i++){
      const r = s('rect',{x:this.x(i)-G.RG/2+3, y:G.F+2, width:G.RG-6, height:H-2*G.F-4, rx:8, class:'sb-hl'});
      svg.append(r); this.hl[i]=r;
    }
    for (let i=0;i<n;i++){ const x=this.x(i); svg.append(s('line',{x1:x, y1:G.F, x2:x, y2:bottomY, class:'sb-rod'})); }
    svg.append(s('rect',{x:G.F-2, y:beamY, width:W-2*G.F+4, height:G.B, class:'sb-beam'}));
    for (let i=0;i<n;i+=3) svg.append(s('circle',{cx:this.x(i), cy:beamY+G.B/2, r:2.6, class:'sb-dot'}));
    for (let i=0;i<n;i++){
      const x=this.x(i);
      const g = s('g',{class:'sb-col'});
      if (this.interactive){
        g.setAttribute('tabindex','0'); g.setAttribute('role','slider');
        g.setAttribute('aria-valuemin','0'); g.setAttribute('aria-valuemax','9');
        g.setAttribute('aria-label', `Tige des ${PLACE_LONG[i]}`);
        g.addEventListener('keydown', ev => this.key(ev, i));
        g.addEventListener('focus', () => this.hl[i].classList.add('focus'));
        g.addEventListener('blur', () => this.hl[i].classList.remove('focus'));
      }
      const b = {h:null, e:[]};
      b.h = this.bead(g, x, G.F + 3 + G.BH/2, 'sky', () => this.tapHeaven(i));
      for (let k=0;k<4;k++) b.e[k] = this.bead(g, x, bottomY - (4-k)*G.BH - 3 + G.BH/2, 'earth', () => this.tapEarth(i,k));
      this.beads[i]=b; this.cols[i]=g; svg.append(g);
    }
    for (let i=0;i<n;i++){
      const x=this.x(i);
      const t = s('text',{x, y:H+24, class:'sb-digit', 'text-anchor':'middle'}); svg.append(t); this.digitEls[i]=t;
      if (this.labels){ const l = s('text',{x, y:H+41, class:'sb-place', 'text-anchor':'middle'}); l.textContent = PLACE[i]; svg.append(l); }
    }
    if (this.annot){
      const a = s('g',{class:'sb-annot'}), tx = W + 18;
      const lab = (y, t1, t2) => {
        a.append(s('line',{x1:W-6, y1:y, x2:W+12, y2:y}));
        const t = s('text',{x:tx, y:y-3, class:'b'}); t.textContent=t1; a.append(t);
        const u = s('text',{x:tx, y:y+14}); u.textContent=t2; a.append(u);
      };
      lab(G.F + 17, 'Perle du ciel', 'elle vaut 5');
      lab(beamY + G.B/2, 'La barre', 'on compte ce qui la touche');
      lab(beamY + G.B + G.EZ/2, 'Perles de la terre', 'elles valent 1 chacune');
      svg.append(a);
    }
    this.svg = svg;
    this.svg.classList.toggle('no-digits', !this.showDigits);
    this.host.append(svg);
    this.render();
  }
  bead(parent, cx, cy, kind, onTap){
    const g = s('g',{class:`sb-bead ${kind}`});
    const inner = s('g',{transform:`translate(${cx} ${cy})`});
    inner.append(s('path',{d:BEAD_D, class:'sb-bead-body'}));
    inner.append(s('line',{x1:-G.BW/2+4, y1:0, x2:G.BW/2-4, y2:0, class:'sb-bead-ridge'}));
    inner.append(s('rect',{x:-8, y:-G.BH/2+3, width:16, height:4, rx:2, class:'sb-bead-shine'}));
    g.append(inner);
    if (this.interactive) g.addEventListener('click', e => { e.stopPropagation(); if (!this.locked) onTap(); });
    parent.append(g);
    return g;
  }
  tapHeaven(i){ this.st[i].h ^= 1; this.changed(); }
  tapEarth(i,k){ const r=this.st[i]; r.e = k < r.e ? k : k+1; this.changed(); }
  key(ev, i){
    if (this.locked) return;
    const d = this.digit(i);
    if (ev.key==='ArrowUp'){ this.setDigit(i, Math.min(9,d+1)); }
    else if (ev.key==='ArrowDown'){ this.setDigit(i, Math.max(0,d-1)); }
    else if (/^[0-9]$/.test(ev.key)){ this.setDigit(i, +ev.key); }
    else if (ev.key==='ArrowLeft'){ if (i<this.n-1) this.cols[i+1].focus(); }
    else if (ev.key==='ArrowRight'){ if (i>0) this.cols[i-1].focus(); }
    else return;
    ev.preventDefault(); ev.stopPropagation();
    if (!/^Arrow(Left|Right)$/.test(ev.key)) this.changed();
  }
  digit(i){ return this.st[i].h*5 + this.st[i].e; }
  setDigit(i, d){ this.st[i] = {h: d>=5?1:0, e: d%5}; }
  getValue(){ return this.st.reduce((sum,r,i) => sum + (r.h*5+r.e)*10**i, 0); }
  setValue(v){ for (let i=0;i<this.n;i++) this.setDigit(i, Math.floor(v/10**i)%10); this.render(); }
  setState(st){ this.st = st.map(r => ({h:r.h, e:r.e})); this.render(); }
  changed(){ this.render(); if (this.onChange) this.onChange(this.getValue(), this); }
  lock(b){ this.locked = b; this.svg.classList.toggle('locked', b); }
  setDigitsVisible(b){ this.svg.classList.toggle('no-digits', !b); }
  highlight(i){ this.hl.forEach((r,k) => r.classList.toggle('on', k===i)); }
  render(){
    for (let i=0;i<this.n;i++){
      const r=this.st[i], b=this.beads[i];
      b.h.style.transform = r.h ? `translateY(${G.T}px)` : 'translateY(0px)';
      b.e.forEach((el,k) => { el.style.transform = k < r.e ? `translateY(${-G.T}px)` : 'translateY(0px)'; });
      const d = r.h*5 + r.e;
      this.digitEls[i].textContent = d;
      if (this.interactive){ this.cols[i].setAttribute('aria-valuenow', d); }
    }
  }
}

/* =========================================================
   La méthode : plans pas à pas (direct, petit ami, grand ami)
   ========================================================= */
const digitOf = (st,i) => st[i].h*5 + st[i].e;
function stFromValue(v, n){ const st=[]; for (let i=0;i<n;i++){ const d=Math.floor(v/10**i)%10; st.push({h:d>=5?1:0, e:d%5}); } return st; }
function valueOf(st){ return st.reduce((sum,r,i) => sum + (r.h*5+r.e)*10**i, 0); }
function applyMove(st, m){ const r=st[m.pos]; if (m.k==='hD') r.h=1; else if (m.k==='hU') r.h=0; else if (m.k==='eU') r.e+=m.n; else r.e-=m.n; }
function moveLabel(m){
  const v = m.k==='hD' ? '+5' : m.k==='hU' ? MINUS+'5' : m.k==='eU' ? '+'+m.n : MINUS+m.n;
  return `${v} (${PLACE[m.pos]})`;
}
const canAdd = (r,d) => !(d>=5 && r.h) && r.e + d%5 <= 4;
const canSub = (r,d) => !(d>=5 && !r.h) && d%5 <= r.e;
function addMoves(pos,d){ const m=[]; if (d>=5) m.push({pos,k:'hD'}); if (d%5) m.push({pos,k:'eU',n:d%5}); return m; }
function subMoves(pos,d){ const m=[]; if (d>=5) m.push({pos,k:'hU'}); if (d%5) m.push({pos,k:'eD',n:d%5}); return m; }
function sayAdd(d){ if (d<5) return `je monte ${plural(d,'perle')} du bas`; if (d===5) return 'je descends la perle du ciel'; return `je descends la perle du ciel et je monte ${plural(d-5,'perle')} du bas`; }
function saySub(d){ if (d<5) return `je redescends ${plural(d,'perle')} du bas`; if (d===5) return 'je remonte la perle du ciel'; return `je remonte la perle du ciel et je redescends ${plural(d-5,'perle')} du bas`; }
const rodName = pos => `tige des ${PLACE_LONG[pos]}`;

function planAdd(st, pos, d, out, depth=0){
  if (!d) return true;
  if (pos >= st.length) return false;
  const r = st[pos], x = digitOf(st,pos);
  if (x + d <= 9){
    let g;
    if (canAdd(r,d)) g = {type:'direct', pos, depth, text:`${cap(rodName(pos))} : j'ajoute ${d}, ${sayAdd(d)}.`, moves:addMoves(pos,d)};
    else { const c=5-d; g = {type:'ami5', pos, depth, text:`${cap(rodName(pos))} : pas assez de perles en bas pour ajouter ${d}. Petit ami : ${d} = 5 ${MINUS} ${c}. Je descends la perle du ciel, puis je redescends ${plural(c,'perle')} du bas.`, moves:[{pos,k:'hD'},{pos,k:'eD',n:c}]}; }
    out.push(g); g.moves.forEach(m => applyMove(st,m)); return true;
  }
  const c = 10-d; let moves, type='ami10', how;
  if (canSub(r,c)){ moves = subMoves(pos,c); how = saySub(c); }
  else { moves = [{pos,k:'hU'},{pos,k:'eU',n:5-c}]; type='combo'; how = `je remonte la perle du ciel et je monte ${plural(5-c,'perle')}, car ${c} = 5 ${MINUS} ${5-c}`; }
  if (pos+1 >= st.length) return false;
  out.push({type, pos, depth, text:`${cap(rodName(pos))} : pas de place pour ajouter ${d}. Grand ami : ${d} = 10 ${MINUS} ${c}. J'enlève ${c} ici (${how}), puis j'ajoute 1 sur la ${rodName(pos+1)}.`, moves});
  moves.forEach(m => applyMove(st,m));
  return planAdd(st, pos+1, 1, out, depth+1);
}
function planSub(st, pos, d, out, depth=0){
  if (!d) return true;
  if (pos >= st.length) return false;
  const r = st[pos], x = digitOf(st,pos);
  if (x >= d){
    let g;
    if (canSub(r,d)) g = {type:'direct', pos, depth, text:`${cap(rodName(pos))} : j'enlève ${d}, ${saySub(d)}.`, moves:subMoves(pos,d)};
    else { const c=5-d; g = {type:'ami5', pos, depth, text:`${cap(rodName(pos))} : pas assez de perles en bas pour enlever ${d}. Petit ami : ${d} = 5 ${MINUS} ${c}. Je remonte la perle du ciel, puis je monte ${plural(c,'perle')} du bas.`, moves:[{pos,k:'hU'},{pos,k:'eU',n:c}]}; }
    out.push(g); g.moves.forEach(m => applyMove(st,m)); return true;
  }
  if (pos+1 >= st.length) return false;
  const c = 10-d;
  out.push({type:'ami10', pos, depth, text:`${cap(rodName(pos))} : pas assez pour enlever ${d}. Grand ami : ${d} = 10 ${MINUS} ${c}. J'enlève 1 sur la ${rodName(pos+1)}, puis j'ajoute ${c} ici.`, moves:[]});
  if (!planSub(st, pos+1, 1, out, depth+1)) return false;
  return planAdd(st, pos, c, out, depth+1);
}
const OPSYM = {'+':'+', '-':MINUS, '×':'×', '÷':'÷'};
const OPNAME = {'+':'plus', '-':'moins', '×':'fois', '÷':'divisé par'};
/* Multiplier : on ajoute chaque produit des tables (toujours 2 chiffres) sur 2 tiges, de gauche à droite */
function multPlan(a, m, rods){
  const ds = String(a); rods = Math.max(rods||0, ds.length+1);
  const st = stFromValue(0, rods), groups = []; let ok = true;
  for (let k=0; k<ds.length && ok; k++){
    const digit = +ds[k], pos = ds.length-1-k, prod = digit*m, two = String(prod).padStart(2,'0');
    groups.push({type:'head', pos:pos+1, depth:0, moves:[],
      text: prod ? `${digit} × ${m} = ${two}. J'ajoute ${two} sur les tiges ${PLACE[pos+1]} et ${PLACE[pos]}.` : `${digit} × ${m} = 0. Rien à ajouter.`});
    const t = Math.floor(prod/10), u = prod%10;
    if (t) ok = planAdd(st, pos+1, t, groups, 1) && ok;
    if (u) ok = planAdd(st, pos, u, groups, 1) && ok;
  }
  return {ok: ok && valueOf(st)===a*m, groups, result:a*m, a, b:m, op:'×', rods, start:0};
}
/* Diviser : de gauche à droite, combien de fois d rentre, puis on enlève le produit */
function divSteps(D, d){
  const ds = String(D), n = ds.length, out = []; let r = 0;
  for (let k=0; k<n; k++){ const pos = n-1-k; r = r*10 + (+ds[k]); const q = Math.floor(r/d); out.push({pos, part:r, q, sub:q*d}); r -= q*d; }
  const f = out.findIndex(x => x.q > 0);
  return out.slice(f < 0 ? n-1 : f);
}
const whereSub = (sub, pos) => sub < 10 ? `sur la ${rodName(pos)}` : `sur les tiges ${PLACE[pos+1]} et ${PLACE[pos]}`;
function divPlan(D, d, rods){
  rods = Math.max(rods||0, String(D).length);
  const st = stFromValue(D, rods), groups = [], steps = divSteps(D, d); let ok = true;
  steps.forEach(x => {
    groups.push({type:'head', pos:x.pos, depth:0, moves:[], q:x.q,
      text: x.q ? `Combien de fois ${d} dans ${x.part} ? ${x.q} fois. J'écris ${x.q} au résultat et j'enlève ${x.q} × ${d} = ${x.sub} ${whereSub(x.sub, x.pos)}.`
               : `${x.part} est plus petit que ${d} : j'écris 0 au résultat.`});
    const t = Math.floor(x.sub/10), u = x.sub%10;
    if (t) ok = planSub(st, x.pos+1, t, groups, 1) && ok;
    if (u) ok = planSub(st, x.pos, u, groups, 1) && ok;
  });
  return {ok: ok && valueOf(st)===0 && D % d === 0, groups, result:D/d, a:D, b:d, op:'÷', rods, start:D, steps};
}
function makePlan(a, op, b, rods){
  if (op==='×') return multPlan(a, b, rods);
  if (op==='÷') return divPlan(a, b, rods);
  const st = stFromValue(a, rods), groups = [];
  let ok = true;
  for (let pos=String(b).length-1; pos>=0 && ok; pos--){
    const d = Math.floor(b/10**pos)%10;
    ok = op==='+' ? planAdd(st,pos,d,groups) : planSub(st,pos,d,groups);
  }
  const result = op==='+' ? a+b : a-b;
  return {ok: ok && valueOf(st)===result, groups, result, a, b, op, rods, start:a};
}
function genProblem(cfg, seen){
  for (let t=0;t<3000;t++){
    const a = rand(cfg.a[0], cfg.a[1]), b = rand(cfg.b[0], cfg.b[1]);
    if (!b) continue;
    if (cfg.op==='-' && b>=a) continue;
    if (cfg.op==='+' && a+b >= 10**cfg.rods) continue;
    const key = `${a}${cfg.op}${b}`;
    if (seen && seen.has(key) && t<2500) continue;
    const p = makePlan(a, cfg.op, b, cfg.rods);
    if (!p.ok) continue;
    const types = new Set(p.groups.map(g => g.type));
    if (cfg.allow && [...types].some(x => !cfg.allow.includes(x))) continue;
    if ((cfg.need||[]).some(x => !types.has(x))) continue;
    if (seen) seen.add(key);
    return p;
  }
  return makePlan(2, '+', 2, cfg.rods);
}

/* Liste des étapes + animation */
function renderPlanList(list, groups, active=-1, upto=groups.length){
  list.replaceChildren(...groups.slice(0, upto).map((g,gi) =>
    h('li', {class: [g.depth?'sub':'', gi===active?'active':'', gi<active?'done':''].join(' ').trim(), 'data-gi':gi},
      h('span',{}, g.text),
      g.moves.length ? h('span',{class:'mvs'}, g.moves.map((m,mi) => h('span',{class:'mv'+(gi<active?' on':''), 'data-mi':mi}, moveLabel(m)))) : null
    )));
}
async function playPlan(sb, p, list, alive, onGroup){
  sb.setValue(p.start ?? p.a); renderPlanList(list, p.groups, -1);
  await wait(500);
  for (let gi=0; gi<p.groups.length; gi++){
    if (!alive()) return false;
    const g = p.groups[gi];
    renderPlanList(list, p.groups, gi);
    if (onGroup) onGroup(g, gi);
    sb.highlight(g.pos);
    await wait(g.moves.length ? 1000 : 1500);
    for (let mi=0; mi<g.moves.length; mi++){
      if (!alive()) return false;
      applyMove(sb.st, g.moves[mi]); sb.render();
      const chip = list.querySelector(`li[data-gi="${gi}"] .mv[data-mi="${mi}"]`);
      if (chip) chip.classList.add('on');
      await wait(900);
    }
  }
  if (!alive()) return false;
  sb.highlight(null); renderPlanList(list, p.groups, p.groups.length);
  return true;
}

/* =========================================================
   Pavé numérique
   ========================================================= */
let activeKeypad = null;
function makeKeypad({maxLen=5, onSubmit, label='Ta réponse'}){
  let val = '';
  const disp = h('div',{class:'kp-display empty', 'aria-live':'polite'});
  const upd = () => { disp.textContent = val==='' ? '?' : fmt(+val); disp.classList.toggle('empty', val===''); };
  const kp = { disabled:false, el:null,
    press(k){ if (kp.disabled) return;
      if (k==='del') val = val.slice(0,-1);
      else if (k==='ok'){ if (val!=='') onSubmit(+val); return; }
      else if (val.length < maxLen) val = (val==='0' ? '' : val) + k;
      upd(); },
    clear(){ val=''; upd(); },
    enable(b){ kp.disabled = !b; kp.el.classList.toggle('off', !b); if (b) activeKeypad = kp; }
  };
  const keys = ['1','2','3','4','5','6','7','8','9','del','0','ok'];
  const grid = h('div',{class:'kp-grid'}, keys.map(k => h('button',{type:'button', class:'kp-key'+(k==='ok'?' ok':k==='del'?' del':''), 'aria-label': k==='del'?'Effacer':k==='ok'?'Valider':k, onclick:() => kp.press(k)}, k==='del'?'⌫':k==='ok'?'OK':k)));
  kp.el = h('div',{class:'keypad'}, h('div',{class:'kp-label'}, label), disp, grid);
  kp.el.addEventListener('pointerdown', () => { activeKeypad = kp; });
  upd(); activeKeypad = kp;
  return kp;
}
document.addEventListener('keydown', e => {
  const kp = activeKeypad;
  if (!kp || kp.disabled || !document.contains(kp.el)) return;
  if (e.target.closest && e.target.closest('input,textarea,select,.sb-col')) return;
  if (/^[0-9]$/.test(e.key)){ kp.press(e.key); e.preventDefault(); }
  else if (e.key==='Backspace'){ kp.press('del'); e.preventDefault(); }
  else if (e.key==='Enter' && e.target.tagName!=='BUTTON'){ kp.press('ok'); e.preventDefault(); }
});

/* =========================================================
   Moteur de jeu : manches, perles de progression, étoiles
   ========================================================= */
let gameSeq = 0, curLessonId = null;
function makeGame(host, cfg){
  const key = curLessonId ? `${curLessonId}/${gameSeq++}` : null;
  const prog = h('div',{class:'pbeads', 'aria-hidden':'true'});
  const count = h('span',{class:'pcount'});
  const body = h('div',{class:'game-body'});
  const panel = h('section',{class:'game', 'aria-label':cfg.title},
    h('div',{class:'game-head'},
      h('div',{}, h('p',{class:'eyebrow'}, cfg.eyebrow || 'Jeu'), h('h2',{class:'game-title'}, cfg.title)),
      h('div',{class:'game-prog'}, prog, count)),
    cfg.intro ? h('p',{class:'game-intro', html:cfg.intro}) : null,
    body);
  host.append(panel);
  let idx=0, res=[], ctx={}, token=0;
  const draw = () => {
    prog.replaceChildren(...Array.from({length:cfg.total}, (_,i) => h('span',{class: i<res.length ? (res[i]?'ok':'miss') : i===idx ? 'cur' : ''})));
    count.textContent = `${Math.min(idx+1, cfg.total)} / ${cfg.total}`;
  };
  const start = (fresh) => {
    ctx = cfg.setup ? cfg.setup() : {};
    const sv = !fresh && key ? Store.game(key) : null;
    if (sv && Array.isArray(sv.res) && sv.idx > 0){ idx = Math.min(sv.idx, cfg.total); res = sv.res.slice(0, idx); }
    else { idx = 0; res = []; if (key) Store.setGame(key, null); }
    next();
  };
  const next = () => {
    const my = ++token;
    if (idx >= cfg.total) return finish();
    draw(); body.replaceChildren();
    cfg.round(api(my), idx, ctx);
  };
  const api = my => ({
    body,
    alive: () => my===token && document.contains(panel),
    done(first, {auto=false, delay=1100}={}){
      if (my!==token) return;
      res.push(!!first); idx++;
      if (key) Store.setGame(key, {idx, res});
      prog.replaceChildren(...Array.from({length:cfg.total}, (_,i) => h('span',{class: i<res.length ? (res[i]?'ok':'miss') : ''})));
      if (auto) setTimeout(() => { if (my===token) next(); }, delay);
    },
    next: () => { if (my===token) next(); }
  });
  function finish(){
    const good = res.filter(Boolean).length, ratio = good/cfg.total;
    const stars = ratio>=.9 ? 3 : ratio>=.65 ? 2 : 1;
    if (cfg.saveAs) { Store.setStars(cfg.saveAs, stars); refreshTotal(); }
    draw(); count.textContent = 'Terminé';
    const msg = stars===3 ? "Parfait. Tu peux passer à la suite."
      : stars===2 ? "Bien joué. Rejoue une fois pour viser les 3 étoiles, ou passe à la suite."
      : "Ça vient. Relis l'explication au-dessus, puis rejoue : c'est en répétant que les doigts apprennent.";
    body.replaceChildren(h('div',{class:'summary'},
      starRow(stars,'lg'),
      h('p',{class:'sum-big'}, `${good} sur ${cfg.total} du premier coup`),
      h('p',{class:'muted'}, msg),
      !Store.cur() ? h('p',{class:'small-note'}, "Tes étoiles ne sont pas gardées : choisis ton prénom en haut de l'étape.") : null,
      h('div',{class:'btns'},
        h('button',{class:'btn', type:'button', onclick:() => start(true)}, 'Rejouer'),
        cfg.onNext ? h('button',{class:'btn primary', type:'button', onclick:cfg.onNext}, cfg.nextLabel || 'Étape suivante') : null)));
  }
  start(false);
  return {panel};
}

/* --- Manche : poser un nombre --- */
function diffHint(sb, target){
  const v = sb.getValue();
  if (target < 10 && sb.n === 1){
    const d = v;
    if (target>=5 && d<5) return `Pour ${target}, il faut la perle du ciel : elle vaut 5.`;
    if (target<5 && d>=5) return `La perle du ciel vaut 5 : c'est trop pour ${target}.`;
    return `Compte les perles du bas qui touchent la barre : il en faut ${target%5}.`;
  }
  for (let i=sb.n-1;i>=0;i--){
    const td = Math.floor(target/10**i)%10, d = sb.digit(i);
    if (td !== d) return `Regarde la tige des ${PLACE_LONG[i]} : il faut ${td}, tu as mis ${d}.`;
  }
  return '';
}
function poseRound(api, target, {rods=1, labels=false}={}){
  let missed = false;
  const fb = h('p',{class:'fb', 'aria-live':'polite'});

  api.body.append(h('p',{class:'ask'}, 'Pose ', h('b',{class:'num'}, fmt(target)), ' sur le boulier.'), host);

      fb.className='fb good'; fb.textContent = missed ? `Voilà, c'est bien ${fmt(target)}.` : `Bravo, c'est bien ${fmt(target)} !`;
      sb.setDigitsVisible(true);
      api.done(!missed, {auto:true, delay:1300});
    } else {
      missed = true; fb.className='fb bad'; fb.textContent = `Pas encore. ${diffHint(sb, target)}`;
      host.classList.remove('shake'); void host.offsetWidth; host.classList.add('shake');

/* --- Manche : lire le boulier --- */
function readRound(api, target, {rods=1, labels=false}={}){
  let missed = false;
  const fb = h('p',{class:'fb', 'aria-live':'polite'});

  api.body.append(h('p',{class:'ask'}, 'Quel nombre montre le boulier ?'));

  api.body.append(grid);
  const sb = new Soroban(host, {rods, digits:false, labels, interactive:false, value:target});
  const win = () => { fb.className='fb good'; fb.textContent = missed ? `Oui, c'est ${fmt(target)}.` : `Bravo, c'est ${fmt(target)} !`; sb.setDigitsVisible(true); api.done(!missed, {auto:true, delay:1300}); };
  const lose = v => { missed = true; fb.className='fb bad';
    fb.textContent = target<10 ? (target>=5 ? `Non, pas ${v}. La perle du ciel compte pour 5, ajoute les perles du bas.` : `Non, pas ${v}. Compte seulement les perles qui touchent la barre.`)
      : `Non, pas ${fmt(v)}. Lis chaque tige de gauche à droite.`; };
  if (target < 10 && rods === 1){

/* --- Manche : trouver l'ami de 5 ou de 10 --- */

/* --- Manche : diviser sur le boulier --- */
function divRound(api, D, d){
  const steps = divSteps(D, d), Q = D/d, rods = Math.max(2, String(D).length);
  const after = []; { let v = D; steps.forEach(x => { v -= x.sub*10**x.pos; after.push(v); }); }
  let si = 0, phase = 'choose', missed = false, helped = false, playing = false, solved = false, qStr = '';
  const ansEl = h('span',{class:'ans'}, '?');
  const qEl = h('span',{class:'qdigits'});
  const prompt = h('p',{class:'ask'});
  const fb = h('p',{class:'fb', 'aria-live':'polite'});
  const list = h('ol',{class:'plan'}); list.hidden = true;
  const host = h('div',{class:'sb-host'});
  const ch = h('div',{class:'choices', role:'group', 'aria-label':'Combien de fois ?'});
  const sb = new Soroban(host, {rods, value:D, labels:true, digits:true, onChange:v => {
    if (playing || solved || phase !== 'subtract') return;
    if (v === after[si]){ fb.className='fb good'; fb.textContent = 'Oui !'; nextStep(); }
  }});
  const drawQ = () => qEl.textContent = qStr + '_'.repeat(Math.max(0, steps.length - qStr.length));
  const draw = () => {
    drawQ(); list.hidden = true;
    if (solved) { prompt.textContent = ''; ch.hidden = true; return; }
    const x = steps[si];
    if (phase === 'choose'){
      prompt.textContent = fr(x.part < 10 && x.pos >= 0 ? `Regarde la ${rodName(x.pos)} : combien de fois ${d} dans ${x.part} ?`
        : `Regarde les tiges ${PLACE[x.pos+1]} et ${PLACE[x.pos]} : combien de fois ${d} dans ${x.part} ?`);
      ch.hidden = false; sb.lock(true); sb.highlight(x.pos);
      ch.querySelectorAll('button').forEach(b => { b.disabled = false; b.className = 'choice'; });
    } else {
      prompt.textContent = fr(`Enlève ${x.q} × ${d} = ${x.sub} ${whereSub(x.sub, x.pos)}.`);
      ch.hidden = true; sb.lock(false); sb.highlight(x.pos);
    }
  };
  const nextStep = () => {
    si++;
    if (si >= steps.length){
      solved = true; sb.lock(true); sb.highlight(null); drawQ();
      ansEl.textContent = fmt(Q); ansEl.classList.add('ok');
      fb.className='fb good'; fb.textContent = fr(`${helped||missed ? "C'est ça" : 'Bravo'} ! ${fmt(D)} ÷ ${d} = ${fmt(Q)}. Le boulier est vide : la division tombe juste.`);
      tools.replaceChildren(nextBtn); draw(); api.done(!missed && !helped); nextBtn.focus({preventScroll:true});
    } else { phase = 'choose'; draw(); }
  };
  for (let q=0; q<=9; q++){
    const b = h('button',{class:'choice', type:'button', onclick:() => {
      if (playing || solved || phase !== 'choose') return;
      const x = steps[si];
      if (q === x.q){
        qStr += q; fb.className='fb good';
        if (x.sub === 0){ fb.textContent = fr(`Oui : ${x.part} est plus petit que ${d}, on écrit 0.`); nextStep(); }
        else { fb.textContent = fr(`Oui : ${q} × ${d} = ${x.sub}.`); phase = 'subtract'; draw(); }
      } else {
        missed = true; b.classList.add('wrong'); b.disabled = true; fb.className='fb bad';
        fb.textContent = fr(q*d > x.part ? `Trop grand : ${q} × ${d} = ${q*d}, c'est plus que ${x.part}.`
          : `Trop petit : ${q} × ${d} = ${q*d}. Il reste ${x.part - q*d}, il y a encore de la place pour un ${d}.`);
      }
    }}, q);
    ch.append(b);
  }
  const hintBtn = h('button',{class:'btn', type:'button', onclick:() => {
    if (playing || solved) return;
    helped = true; const x = steps[si];
    if (phase === 'choose'){
      const ms = []; for (let k=1; k<=9; k++){ ms.push(`${k} × ${d} = ${k*d}`); if (k*d > x.part) break; }
      fb.className='fb'; fb.textContent = fr(`La table de ${d} : ${ms.join(' · ')}. Prends le plus grand qui ne dépasse pas ${x.part}.`);
    } else {
      const st = stFromValue(si ? after[si-1] : D, rods), gs = [];
      const t = Math.floor(x.sub/10), u = x.sub%10;
      if (t) planSub(st, x.pos+1, t, gs); if (u) planSub(st, x.pos, u, gs);
      sb.setValue(si ? after[si-1] : D); renderPlanList(list, gs, -1); list.hidden = false;
      fb.className='fb'; fb.textContent = 'Voici comment faire :';
    }
  }}, 'Indice');
  const showBtn = h('button',{class:'btn', type:'button', onclick: async () => {
    if (playing || solved) return;
    helped = true; playing = true; ch.hidden = true; sb.lock(true); list.hidden = false;
    hintBtn.disabled = showBtn.disabled = resetBtn.disabled = true;
    qStr = ''; drawQ(); fb.className='fb'; fb.textContent = 'Regarde bien…';
    const p = divPlan(D, d, rods);
    const ok = await playPlan(sb, p, list, api.alive, g => { if (g.q != null){ qStr += g.q; drawQ(); } });
    if (!ok || !api.alive()) return;
    fb.textContent = fr(`${fmt(D)} ÷ ${d} = ${fmt(Q)}.`);
    await wait(1600);
    if (!api.alive()) return;
    playing = false; si = 0; phase = 'choose'; qStr = ''; sb.setValue(D);
    hintBtn.disabled = showBtn.disabled = resetBtn.disabled = false;
    draw(); fb.textContent = 'À toi maintenant : refais-le toi-même.';
  }}, 'Montre-moi');
  const resetBtn = h('button',{class:'btn ghost', type:'button', onclick:() => {
    if (playing || solved) return;
    si = 0; phase = 'choose'; qStr = ''; sb.setValue(D); fb.textContent = ''; draw();
  }}, 'Recommencer');
  const nextBtn = h('button',{class:'btn primary', type:'button', onclick:() => api.next()}, 'Suivant');
  const tools = h('div',{class:'btns'}, hintBtn, showBtn, resetBtn);
  api.body.append(
    h('div',{class:'problem', role:'img', 'aria-label':`${D} divisé par ${d}`}, h('span',{},fmt(D)), h('span',{class:'op'},'÷'), h('span',{},d), h('span',{class:'op'},'='), ansEl),
    h('p',{class:'ask small'}, `Le boulier montre ${fmt(D)}. On divise de gauche à droite : on cherche combien de fois ${d} rentre, on l'écrit au résultat, puis on l'enlève du boulier.`),
    h('div',{class:'round-grid'}, host, h('div',{class:'round-side'},
      h('p',{class:'qrow'}, 'Résultat : ', qEl), prompt, ch, fb, tools, list)));
  draw();
}
/* --- Manche : la photo du boulier (anzan) --- */
function photoRound(api, target, ms){
  let shown = false;
  const rods = Math.max(2, String(target).length + 1);
  const fb = h('p',{class:'fb', 'aria-live':'polite'});
  const host = h('div',{class:'sb-host'});
  const curtain = h('div',{class:'curtain'}, 'Prêt ?');
  const sb = new Soroban(host, {rods, digits:false, labels:true, interactive:false, value:target});
  host.append(curtain);
  const kp = makeKeypad({maxLen:4, onSubmit:v => {
    kp.enable(false); curtain.hidden = true; sb.setDigitsVisible(true);
    if (v===target){ fb.className='fb good'; fb.textContent = `Bravo, c'était bien ${fmt(target)} !`; api.done(true, {auto:true, delay:1500}); }
    else {
      fb.className='fb bad'; fb.textContent = `C'était ${fmt(target)}. Regarde l'image encore une fois.`;
      api.done(false);
      side.append(h('div',{class:'btns'}, h('button',{class:'btn primary', type:'button', onclick:() => api.next()}, 'Suivant')));
    }
  }});
  kp.enable(false);
  const goBtn = h('button',{class:'btn primary', type:'button', onclick: async () => {
    if (shown) return; shown = true; goBtn.disabled = true;
    curtain.hidden = true; fb.textContent=''; fb.className='fb';
    await wait(ms);
    if (!api.alive()) return;
    curtain.textContent = '?'; curtain.hidden = false;
    fb.textContent = 'Ferme les yeux une seconde, revois les perles, puis tape le nombre.';
    kp.enable(true);
  }}, 'Montre la photo');
  const side = h('div',{class:'round-side'}, h('div',{class:'btns'}, goBtn), kp.el, fb);
  api.body.append(
    h('p',{class:'ask'}, `Le boulier va apparaître ${(ms/1000).toLocaleString('fr-FR')} seconde${ms>=2000?'s':''}. Retiens les perles !`),
    h('div',{class:'round-grid'}, host, side));
}

function digitCaption(d){
  if (d===0) return "Aucune perle ne touche la barre : c'est zéro.";
  if (d<5) return `${plural(d,'perle')} du bas ${d>1?'touchent':'touche'} la barre : ${d}.`;
  if (d===5) return 'La perle du ciel toute seule : 5.';
  return `La perle du ciel (5) + ${plural(d-5,'perle')} du bas = ${d}.`;
}

/* --- Flash anzan : après une erreur, on refait le calcul sur un boulier --- */
/* Flash : nombres signés (les négatifs sont à enlever) */
function genFlash(o){
  const lo = o.digits===1 ? 1 : 10, hi = o.digits===1 ? 9 : 99;
  for (let t=0; t<300; t++){
    const out = []; let tot = 0, prev = null, guard = 0;
    while (out.length < o.count && guard++ < 500){
      let n = rand(lo, hi);
      if (o.minus && out.length > 0 && Math.random() < 0.45 && tot - n >= 0) n = -n;
      if (n === prev) continue;
      out.push(n); tot += n; prev = n;
    }
    if (out.length === o.count && (!o.minus || out.some(n => n < 0))) return out;
  }
  return [rand(lo,hi), rand(lo,hi), rand(lo,hi)];
}
const flashExpr = nums => nums.map((n,i) => i===0 ? fmt(n) : n < 0 ? `${MINUS} ${fmt(-n)}` : `+ ${fmt(n)}`).join(' ');
const flashShow = n => n < 0 ? `${MINUS}${fmt(-n)}` : fmt(n);
async function runFlash(numEl, nums, speed){
  for (const c of ['3','2','1']){ numEl.className='flash-num count'; numEl.textContent=c; await wait(550); }
  numEl.textContent=''; await wait(300);
  for (const n of nums){ numEl.className='flash-num'+(n<0?' neg':''); numEl.textContent = flashShow(n); await wait(speed); numEl.textContent=''; await wait(180); }
  numEl.className='flash-num msg'; numEl.textContent='Combien ?';
}

function flashPractice(nums){
  const sums = nums.reduce((acc,n) => { acc.push(acc[acc.length-1] + n); return acc; }, [0]);
  const total = sums[sums.length-1];
  const rods = Math.max(2, String(Math.max(...sums)).length + 1);
  const stepPlan = i => makePlan(sums[i], nums[i] < 0 ? '-' : '+', Math.abs(nums[i]), rods);
  let k = 0, playing = false, run = 0;
  const chips = h('div',{class:'mvs', 'aria-label':'Les nombres à ajouter'});
  const totalEl = h('p',{class:'run-total'});
  const fb = h('p',{class:'fb', 'aria-live':'polite'});
  const list = h('ol',{class:'plan'}); list.hidden = true;
  const host = h('div',{class:'sb-host'});
  const el = h('div',{class:'practice'});
  const drawChips = (cur=k) => {
    chips.replaceChildren(...nums.map((n,i) => h('span',{class:'mv big'+(i<cur?' on':'')+(i===cur?' cur':'')}, (i ? (n<0 ? MINUS+' ' : '+ ') : '') + fmt(Math.abs(n)))));
    totalEl.textContent = fr(cur === 0 ? `Pose ${fmt(nums[0])} sur le boulier.`
      : cur < nums.length ? `Le boulier montre ${fmt(sums[cur])}. ${nums[cur] < 0 ? 'Enlève' : 'Ajoute'} ${fmt(Math.abs(nums[cur]))}.` : `Total : ${fmt(total)}`);
  };
  const sb = new Soroban(host, {rods, value:0, labels:true, digits:true, onChange:v => {
    if (playing || k >= nums.length) return;
    if (v === sums[k+1]){
      k++; drawChips(); list.hidden = true;
      if (k === nums.length){
        sb.lock(true); fb.className = 'fb good';
        fb.textContent = fr(`Bravo ! ${flashExpr(nums)} = ${fmt(total)}. Relance un flash quand tu veux.`);
      } else {
        fb.className = 'fb good'; fb.textContent = fr(`Oui, ${fmt(sums[k])}. Au suivant !`);
      }
    } else { fb.className = 'fb'; fb.textContent = ''; }
  }});
  const alive = my => () => my === run && document.contains(el);
  const hintBtn = h('button',{class:'btn', type:'button', onclick:() => {
    if (playing || k >= nums.length) return;
    run++; sb.setValue(sums[k]); sb.lock(false);
    const p = stepPlan(k);
    renderPlanList(list, p.groups, -1); list.hidden = false;
    sb.highlight(p.groups.length ? p.groups[0].pos : null);
    fb.className = 'fb'; fb.textContent = fr(nums[k] < 0 ? `Pour enlever ${fmt(-nums[k])} à ${fmt(sums[k])} :` : `Pour ajouter ${fmt(nums[k])} à ${fmt(sums[k])} :`);
  }}, 'Indice');
  const showBtn = h('button',{class:'btn', type:'button', onclick: async () => {
    if (playing) return;
    const my = ++run; playing = true; sb.lock(true);
    hintBtn.disabled = showBtn.disabled = resetBtn.disabled = true;
    list.hidden = false; fb.className = 'fb'; fb.textContent = 'Regarde bien…';
    for (let i=0; i<nums.length; i++){
      drawChips(i);
      const ok = await playPlan(sb, stepPlan(i), list, alive(my));
      if (!ok) return;
    }
    drawChips(nums.length);
    fb.textContent = fr(`${flashExpr(nums)} = ${fmt(total)}.`);
    await wait(1600);
    if (!alive(my)()) return;
    playing = false; k = 0; sb.setValue(0); sb.highlight(null); sb.lock(false); drawChips(); list.hidden = true;
    hintBtn.disabled = showBtn.disabled = resetBtn.disabled = false;
    fb.textContent = 'À toi maintenant : refais-le en entier.';
  }}, 'Montre-moi');
  const resetBtn = h('button',{class:'btn ghost', type:'button', onclick:() => {
    if (playing) return;
    run++; k = 0; sb.setValue(0); sb.highlight(null); sb.lock(false); drawChips(); list.hidden = true; fb.textContent = '';
  }}, 'Recommencer');
  drawChips();
  el.append(
    h('h3',{class:'practice-title'}, 'On le refait sur le boulier'),
    h('p',{class:'muted'}, `Pose d'abord ${fmt(nums[0])}, puis ${nums.some(n => n < 0) ? 'ajoute ou enlève' : 'ajoute'} les autres nombres un par un. Le nombre suivant s'allume dès que le boulier est juste.`),
    chips,
    h('div',{class:'round-grid'}, host, h('div',{class:'round-side'}, totalEl, h('div',{class:'btns'}, hintBtn, showBtn, resetBtn), fb, list)));
  return el;
}

/* --- Flash anzan --- */
function makeFlash(){
  const opt = {digits:1, count:3, speed:1300, minus:false};
  let nums=[], tries=0, wins=0, running=false;
  const seg = (label, key, options) => {
    const g = h('div',{class:'chips', role:'group', 'aria-label':label});
    options.forEach(([val, txt]) => g.append(h('button',{class:'chip', type:'button', 'aria-pressed': opt[key]===val?'true':'false', onclick:e => {
      if (running) return; opt[key]=val; g.querySelectorAll('button').forEach(b => b.setAttribute('aria-pressed', b===e.currentTarget?'true':'false'));
    }}, txt)));
    return h('div',{class:'seg'}, h('span',{class:'seg-label'}, label), g);
  };
  const numEl = h('span',{class:'flash-num msg'}, 'Prêt ?');
  const screen = h('div',{class:'flash-screen', 'aria-live':'off'}, numEl);
  const result = h('p',{class:'fb', 'aria-live':'polite'});
  const tally = h('p',{class:'small-note'}, 'Pas encore de partie.');
  const startBtn = h('button',{class:'btn primary', type:'button'}, 'Partir');
  const practiceHost = h('div',{class:'practice-host'});
  const kp = makeKeypad({maxLen:4, label:'Le total', onSubmit:v => {
    kp.enable(false); tries++;
    const total = nums.reduce((a,b) => a+b, 0), expr = flashExpr(nums);
    if (v===total){ wins++; result.className='fb good'; result.textContent = fr(`Bravo ! ${expr} = ${fmt(total)}`); practiceHost.replaceChildren(); }
    else {
      result.className='fb bad'; result.textContent = fr(`Le total était ${fmt(total)} : ${expr}. Tu as répondu ${fmt(v)}.`);
      practiceHost.replaceChildren(flashPractice(nums.slice()));
    }
    numEl.className='flash-num'; numEl.textContent = fmt(total);
    tally.textContent = fr(`Cette fois-ci : ${wins} réussi${wins>1?'s':''} sur ${tries}.`);
    startBtn.disabled = false; startBtn.textContent = 'Encore';
  }});
  kp.enable(false);
  startBtn.addEventListener('click', async () => {
    if (running) return;
    running = true; startBtn.disabled = true; kp.enable(false); kp.clear(); result.textContent=''; result.className='fb';
    practiceHost.replaceChildren();
    nums = genFlash(opt);
    await runFlash(numEl, nums, opt.speed);
    running = false; kp.enable(true); kp.clear();
  });
  return h('section',{class:'game', 'aria-label':'Flash anzan'},
    h('div',{class:'game-head'}, h('div',{}, h('p',{class:'eyebrow'}, 'Entraînement libre'), h('h2',{class:'game-title'}, 'Flash anzan'))),
    h('p',{class:'game-intro'}, "Des nombres vont s'afficher l'un après l'autre. Ne les écris pas : ajoute-les sur un boulier imaginaire, en bougeant le pouce et l'index dans l'air. Commence lentement avec 3 nombres, et monte d'un cran quand tu réussis 3 fois de suite."),
    h('div',{class:'flash-set'},
      seg('Chiffres', 'digits', [[1,'1 chiffre'],[2,'2 chiffres']]),
      seg('Nombres', 'count', [[3,'3'],[5,'5'],[8,'8']]),
      seg('Vitesse', 'speed', [[1300,'Lente'],[900,'Moyenne'],[600,'Rapide']]),
      seg('Calculs', 'minus', [[false,'Additions'],[true,'+ et ' + MINUS]])),
    h('div',{class:'flash-row'}, h('div',{class:'round-side'}, screen, h('div',{class:'btns'}, startBtn), result, tally), kp.el),
    practiceHost);
}

  const screen = h('div',{class:'flash-screen', 'aria-live':'off'}, numEl);
  const result = h('p',{class:'fb', 'aria-live':'polite'});
  const status = h('div',{class:'defi-status'});
  const startBtn = h('button',{class:'btn primary', type:'button'}, 'Relever le défi');
  const practiceHost = h('div',{class:'practice-host'});
  const drawStatus = () => {
    const d = Store.cur() ? Store.defi() : null;
    if (!d){ status.replaceChildren(h('p',{class:'muted'}, "Choisis ton prénom en haut de l'étape : sans prénom, le défi ne peut pas être gardé.")); return; }
    if (d.done){
      status.replaceChildren(h('p',{class:'fb good'}, 'Défi réussi : les étapes 8 et 9 sont ouvertes.'),
        h('button',{class:'btn primary', type:'button', onclick:() => go('etape-8')}, 'Aller à « Multiplier » →'));
      return;
    }
    status.replaceChildren(
      h('span',{class:'pbeads defi-beads', 'aria-hidden':'true'}, Array.from({length:DEFI.need}, (_,i) => h('span',{class: i < d.streak ? 'ok' : ''}))),
      h('span',{class:'muted'}, `${d.streak} réussi${d.streak>1?'s':''} d'affilée sur ${DEFI.need}`));
  };
  const kp = makeKeypad({maxLen:4, label:'Le total', onSubmit:v => {
    kp.enable(false);
    const total = nums.reduce((a,b) => a+b, 0), expr = flashExpr(nums), d = Store.cur() ? Store.defi() : null;
    if (v === total){
      result.className='fb good'; result.textContent = fr(`Juste ! ${expr} = ${fmt(total)}`); practiceHost.replaceChildren();
      if (d && !d.done){ d.streak++; if (d.streak >= DEFI.need) d.done = true; Store.save(); }
    } else {
      result.className='fb bad'; result.textContent = fr(`Le total était ${fmt(total)} : ${expr}. Tu as répondu ${fmt(v)}. La série repart à zéro.`);
      if (d && !d.done){ d.streak = 0; Store.save(); }
      practiceHost.replaceChildren(flashPractice(nums.slice()));
    }
    numEl.className='flash-num'; numEl.textContent = fmt(total);
    drawStatus(); refreshTotal();
    startBtn.disabled = false; startBtn.textContent = 'Encore';
  }});
  kp.enable(false);
  startBtn.addEventListener('click', async () => {
    if (running) return;
    running = true; startBtn.disabled = true; kp.enable(false); kp.clear(); result.textContent=''; result.className='fb';
    practiceHost.replaceChildren();
    nums = genFlash(DEFI);
    await runFlash(numEl, nums, DEFI.speed);
    running = false; kp.enable(true); kp.clear();
  });
  drawStatus();
  return h('section',{class:'game defi', id:'defi', 'aria-label':'Le défi des multiplications'},
    h('div',{class:'game-head'}, h('div',{}, h('p',{class:'eyebrow'}, 'Défi'), h('h2',{class:'game-title'}, 'Le défi des multiplications'))),
    h('p',{class:'game-intro', html:"Pour ouvrir les étapes 8 et 9, réussis <b>3 flashs d'affilée</b> : <b>5 nombres à 2 chiffres</b>, avec des additions et des soustractions, à vitesse moyenne. Un nombre précédé de « − » est à enlever. Une erreur, et la série repart à zéro."}),
    status,
    h('div',{class:'flash-row'}, h('div',{class:'round-side'}, screen, h('div',{class:'btns'}, startBtn), result), kp.el),
    practiceHost);
}

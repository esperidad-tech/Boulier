  'etape-8': {d:'environ 6 mois', t:"Dans les écoles UCMAS, la multiplication arrive au niveau 4, après 9 à 13 mois de cours, quand on sait déjà calculer de tête avec des nombres à 2 chiffres. Il faut connaître ses tables."},
  'etape-9': {d:'3 à 5 mois', t:"La division arrive au niveau 6 : après environ 15 mois de cours au rythme rapide, et près de 2 ans avec un cours par semaine."}
};
/* Où en serait un enfant de ces écoles au début de chaque étape (en mois de cours, estimation) */
const STEP_MONTH = [0, 0.35, 0.7, 1.4, 2.2, 3.35, 4.15, 11, 19], ALL_DONE_MONTH = 22;
const monthsText = m => m < 1 ? "quelques semaines" : m < 12 ? `environ ${String(Math.round(m*2)/2).replace('.',',')} mois` : `environ ${Math.round(m/12)} an${m>=24?'s':''}`;
function playerMonth(id){
  const p = Store.peek(id); if (!p || !p.lesson) return null;
  const allDone = LESSONS.every(l => (p.stars[l.id]||0) > 0);
  const idx = LESSONS.findIndex(l => l.id===p.lesson);
  return {m: allDone ? ALL_DONE_MONTH : STEP_MONTH[Math.max(0,idx)], step: idx+1, allDone};
}
function paceSection(){
  const MAX = 48, x = m => Math.sqrt(m/MAX)*100;   // échelle « racine » : les premiers mois restent lisibles
  const rows = [
    {label:'Étapes 1 à 6', sub:'Sur le boulier, nombres à 1 chiffre', lvl:'Niveau 1', fast:[0,3], slow:[0,4.5]},
    {label:'Étape 7', sub:'De tête, nombres à 1 chiffre', lvl:'Niveau 2', fast:[3,6], slow:[4.5,9]},
    {label:'Nombres à 2 chiffres', sub:"Sur le boulier, puis de tête. Pas encore dans l'école du boulier", lvl:'Niveaux 3 et 4', fast:[6,12], slow:[9,18]},
    {label:'Étape 8 : multiplier', sub:"D'abord 2 chiffres × 1 chiffre", lvl:'Niveaux 4 et 5', fast:[9,15], slow:[13.5,22.5]},
    {label:'Étape 9 : diviser', sub:'3 chiffres ÷ 1 chiffre', lvl:'Niveau 6', fast:[15,18], slow:[22.5,27]},
    {label:'Plus grands nombres, décimaux', sub:'Pas encore dans l\'école du boulier', lvl:'Niveaux 7 à 9', fast:[18,27], slow:[27,45]}
  ];
  const ticks = [[0,'0'],[3,'3 mois'],[6,'6 mois'],[12,'1 an'],[24,'2 ans'],[48,'4 ans']];
  const tickCls = m => 'tl-tick' + (m===3 ? ' tl-tick-minor' : '');
  const bar = (r, cls) => h('span',{class:'tl-bar '+cls, style:`left:${x(r[0])}%; width:${x(r[1])-x(r[0])}%`});
  const chart = h('div',{class:'tl'},
    rows.map(r => h('div',{class:'tl-row'},
      h('div',{class:'tl-label'}, h('b',{}, r.label), h('span',{}, `${r.lvl} · ${r.sub}`)),
      h('div',{class:'tl-track', role:'img', 'aria-label':`${r.label} : de ${r.fast[0]} à ${r.fast[1]} mois au rythme rapide, de ${r.slow[0]} à ${r.slow[1]} mois au rythme d'un cours par semaine`},
        bar(r.fast,'fast'), bar(r.slow,'slow')))),
    h('div',{class:'tl-row tl-axis-row'}, h('div',{class:'tl-label'}),
      h('div',{class:'tl-axis', 'aria-hidden':'true'}, ticks.map(([m,t]) => h('span',{class:tickCls(m), style:`left:${x(m)}%`}, t)))));
  // Les joueurs de cet appareil, placés sur la frise
  const marks = PLAYERS.map((pl,i) => ({pl, i, pos:playerMonth(pl.id)})).filter(o => o.pos);
  let who = null;
  if (marks.length){
    const lanes = [];   // dernière position occupée dans chaque ligne, pour que les perles ne se chevauchent pas
    const pins = marks.slice().sort((a,b) => a.pos.m - b.pos.m).map(o => {
      const px = x(o.pos.m);
      let k = lanes.findIndex(last => px - last >= 13);
      if (k < 0){ k = lanes.length; lanes.push(px); } else lanes[k] = px;
      return h('span',{class:'tl-pin'+(o.i%2?' alt':''), style:`left:${px}%; top:${k*24}px`, title:o.pl.name}, o.pl.name.charAt(0));
    });
    const height = lanes.length*24;
    chart.append(h('div',{class:'tl-row'}, h('div',{class:'tl-label'}, h('b',{}, 'Vous')), h('div',{class:'tl-pins', style:`height:${height}px`}, pins)));
    who = h('ul',{class:'tl-who'}, marks.map(o => h('li',{},
      h('span',{class:'pbead'+(o.i%2?' alt':''), 'aria-hidden':'true'}, o.pl.name.charAt(0)),
      h('span',{}, h('b',{}, o.pl.name), ' : ', o.pos.allDone ? `les ${LESSONS.length} étapes réussies` : `étape ${o.pos.step}`,
        `, comme un enfant de ces écoles après ${monthsText(o.pos.m)} de cours.`))));
  }
  return h('section',{class:'pace'},
    h('h2',{}, "Le rythme des écoles d'Asie"),
    h('p',{class:'sub'}, "Pour te situer : voici le temps que prennent les écoles de calcul mental au boulier, pour des enfants qui commencent vers 5 à 7 ans, avec un cours par semaine et des devoirs."),
    h('div',{class:'fig tl-fig'},
      h('div',{class:'tl-legend'}, h('span',{}, h('i',{class:'fast'}), 'Rythme rapide (3 mois par niveau)'), h('span',{}, h('i',{class:'slow'}), 'Un cours par semaine (4 à 5 mois par niveau)')),
      chart, who),
    h('div',{class:'pace-notes'},
      h('div',{}, h('h3',{}, 'Au Japon'), h('p',{html:"On passe des grades, du 10<sup>e</sup> kyu (débutant) au 1<sup>er</sup> kyu, puis les dan. Avec 2 cours par semaine depuis le CP et sans devoirs, un enfant est vers le 8<sup>e</sup> kyu à 7 ans, le 6<sup>e</sup> à 8 ans, le 4<sup>e</sup> à 9 ans, le 2<sup>e</sup> à 10 ans, et le 1<sup>er</sup> kyu vers 12 ans."})),
      h('div',{}, h('h3',{}, 'En Chine'), h('p',{html:"Le zhūxīnsuàn suit le même chemin : le vrai boulier, puis le boulier imaginé, puis les doigts qui bougent dans l'air, et enfin le calcul sans bouger. Les champions s'entraînent des années : Chen Ranran a commencé à 7 ans et faisait plus d'une heure d'exercices chaque soir."})),
      h('div',{}, h('h3',{}, 'Ce que dit la recherche'), h('p',{html:"En Inde, des enfants de 5 à 7 ans ont suivi 3 heures par semaine pendant 3 ans. Ils sont devenus nettement meilleurs en calcul que ceux qui avaient des cours de maths en plus, surtout ceux qui retenaient déjà bien les images. Aux États-Unis, après un an, les élèves de CE1 maîtrisaient mieux le boulier que ceux de CP, mais aucun ne calculait encore mieux que les autres élèves."}))),
    h('p',{class:'small-note'}, "Durées indicatives : elles varient beaucoup d'un enfant et d'une école à l'autre. Les écoles donnent la durée des niveaux ; la répartition étape par étape est une estimation."));
}

const view = $('#view');
const isLocked = l => !!l.lock && !Store.defiDone();
let pendingAnchor = null;
function goDefi(){ pendingAnchor = 'defi'; go('etape-7'); }
const LOCK_SVG = '<svg class="lock-ico" viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="10.5" width="14" height="10" rx="2.5"/><path d="M8.5 10.5V8a3.5 3.5 0 0 1 7 0v2.5"/></svg>';
const MAXSTARS = LESSONS.length*3;
const playerIdx = id => PLAYERS.findIndex(p => p.id===id);
let pendingResume = false, suppressScrollSave = false, scrollTimer = null;

function refreshTotal(){
  const id = Store.cur(), who = $('#who');
  if (!id){
    who.replaceChildren(h('button',{class:'who-btn', type:'button', onclick:() => go('home')}, h('span',{class:'pbead', 'aria-hidden':'true'}, '?'), 'Qui joue ?'));
    return;
  }
  const i = playerIdx(id), pl = PLAYERS[i], t = Store.total(id);
  who.replaceChildren(h('button',{class:'who-btn', type:'button', 'aria-label':`${pl.name}, ${t} étoiles sur ${MAXSTARS}. Changer de joueur`, onclick:() => go('home')},
    h('span',{class:'pbead'+(i%2?' alt':''), 'aria-hidden':'true'}, pl.name.charAt(0)),
    h('span',{}, pl.name),
    h('span',{class:'total', 'aria-hidden':'true'}, svgStar(true), `${t}/${MAXSTARS}`)));
}
function playerStatus(id){
  const p = Store.peek(id);
  if (!p || (!p.lesson && !Object.keys(p.stars).length)) return 'Nouveau';
  const li = LESSONS.findIndex(l => l.id===p.lesson);
  return `${li>=0 ? `Étape ${li+1} · ` : ''}${Store.total(id)} ★`;
}
function pickPlayer(id){
  Store.setCurrent(id);
  const p = Store.player(id);
  pendingResume = true;
  go(p.lesson || LESSONS[0].id);
}
function playerGrid(){
  const cur = Store.cur();
  return h('div',{class:'pgrid', role:'group', 'aria-label':'Choisis ton prénom'},
    PLAYERS.map((pl,i) => h('button',{class:'pbtn'+(i%2?' alt':''), type:'button', 'aria-pressed': cur===pl.id ? 'true' : 'false', onclick:() => pickPlayer(pl.id)},
      h('span',{class:'pbead', 'aria-hidden':'true'}, pl.name.charAt(0)),
      h('span',{}, h('span',{class:'pname'}, pl.name), h('span',{class:'pstat'}, playerStatus(pl.id))))));
}
function renderHome(){
  let showDigits = true;
  const num = h('span',{class:'num', 'aria-live':'polite'}, fmt(2026));
  const host = h('div',{class:'sb-host'});
  const sb = new Soroban(host, {rods:5, value:2026, digits:true, labels:true, scale:1.2, onChange:v => { if (showDigits) num.textContent = fmt(v); }});
  const toggle = h('button',{class:'btn', type:'button', onclick:() => {
    showDigits = !showDigits; sb.setDigitsVisible(showDigits);
    num.textContent = showDigits ? fmt(sb.getValue()) : '?';
    toggle.textContent = showDigits ? 'Cacher les chiffres' : 'Montrer les chiffres';
  }}, 'Cacher les chiffres');
  const hero = h('section',{class:'hero'},
    h('div',{},
      h('p',{class:'eyebrow'}, 'Soroban · calcul mental'),
      h('h1',{}, "L'école du boulier"),
      h('p',{class:'lead'}, "Le boulier est une calculatrice en perles. À force de l'utiliser, on finit par le voir dans sa tête, et on calcule de tête très vite : c'est l'anzan."),
      h('section',{class:'players', id:'players', 'aria-label':'Qui joue ?'},
        h('h2',{}, 'Qui joue ?'),
        h('p',{class:'hintline'}, "Clique sur ton prénom : tu reprends exactement là où tu t'étais arrêté."),
        playerGrid())),
    h('div',{class:'stage'},
      h('div',{class:'readout'}, num, h('span',{class:'cap'}, 'Clique sur une perle', h('br'), 'pour la faire glisser.')),
      host,
      h('ul',{class:'legend'},
        h('li',{}, h('span',{class:'bead-ico sky'}), h('span',{html:'La perle du haut vaut <b>5</b>.'})),
        h('li',{}, h('span',{class:'bead-ico'}), h('span',{html:'Chaque perle du bas vaut <b>1</b>.'})),
        h('li',{}, h('span',{class:'rule-ico'}), h('span',{html:'Une perle compte seulement quand elle <b>touche la barre</b>.'}))),
      h('div',{class:'btns'}, h('button',{class:'btn', type:'button', onclick:() => { sb.setValue(0); if (showDigits) num.textContent='0'; }}, 'Tout effacer'), toggle)));
  const curP = Store.cur() ? Store.peek(Store.cur()) : null;
  const steps = h('ol',{class:'steps'}, LESSONS.map((l,i) => {
    const st = Store.stars(l.id), here = curP && curP.lesson===l.id, locked = isLocked(l);
    const title = h('span',{class:'step-title'}, l.title);
    if (locked) title.insertAdjacentHTML('beforeend', ' ' + LOCK_SVG);
    return h('li',{}, h('button',{class:'step'+(st?' done':'')+(locked?' locked':''), type:'button', onclick:() => go(l.id)},
      h('span',{class:'step-bead', 'aria-hidden':'true'}, i+1),
      h('span',{}, here ? h('span',{class:'here'}, 'Tu en es là') : null, title, h('span',{class:'step-desc'}, locked ? "Fermée : réussis d'abord le défi de l'étape 7." : l.desc)),
      starRow(st)));
  }));
  const path = h('section',{class:'path col'},
    h('h2',{}, 'Le parcours'),
    h('p',{class:'sub'}, "Neuf étapes, dans l'ordre, de la première perle à la division. Tu peux revenir à n'importe quelle étape si tu as oublié."),
    steps,
    paceSection(),
    h('div',{class:'facts'},
      h('div',{}, h('h3',{}, 'Chinois ou japonais ?'), h('p',{html:"Le boulier chinois (<b>suanpan</b>) a 2 perles en haut et 5 en bas. Le japonais (<b>soroban</b>) en a 1 et 4. C'est le soroban qu'on utilise le plus pour apprendre le calcul mental, et c'est lui qu'on apprend ici."})),
      h('div',{}, h('h3',{}, 'Comment ça s\'appelle ?'), h('p',{html:"Le calcul mental au boulier : <b>anzan</b> en japonais, <b>zhūxīnsuàn</b> (珠心算) en chinois. Tu verras aussi « méthode soroban »."})),
      h('div',{}, h('h3',{}, 'Combien de temps ?'), h('p',{html:"<b>10 minutes par jour.</b> Les additions simples viennent en quelques semaines. Calculer de grands nombres de tête demande des mois de pratique régulière."}))));
  view.replaceChildren(hero, path);
}
function stepper(i){
  return h('nav',{class:'lstep', 'aria-label':'Aller à une étape'}, LESSONS.map((x,k) =>
    h('button',{type:'button', class: (Store.stars(x.id) ? 'done' : '') + (isLocked(x) ? ' locked' : ''), 'aria-current': k===i ? 'step' : null, 'aria-label':`Étape ${k+1} : ${x.title}`, title:x.title, onclick:() => go(x.id)}, h('span',{}, k+1))));
}
function renderLesson(l){
  curLessonId = l.id; gameSeq = 0;
  const i = LESSONS.indexOf(l), nextL = LESSONS[i+1];
  const nextFn = nextL ? () => go(nextL.id) : null;
  const el = h('article',{class:'lesson col'},
    h('div',{class:'lesson-nav'},
      h('button',{class:'btn ghost', type:'button', onclick:() => go('home')}, '← Accueil'),
      stepper(i)),
    h('header',{class:'lesson-head'}, h('p',{class:'eyebrow'}, `Étape ${i+1} sur ${LESSONS.length}`), h('h1',{}, l.title), h('p',{class:'lead'}, l.lead)),
    ASIA[l.id] ? h('aside',{class:'asia'},
      h('svg',{viewBox:'0 0 24 24', class:'asia-ico', 'aria-hidden':'true'}),
      h('div',{}, h('p',{class:'asia-label'}, `Dans les écoles d'Asie : ${ASIA[l.id].d}`), h('p',{class:'muted'}, ASIA[l.id].t))) : null);
  const ico = el.querySelector('.asia-ico');
  if (ico){ ico.outerHTML = '<svg class="asia-ico" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>'; }
  if (!Store.cur()){
    el.append(h('div',{class:'notice'},
      h('p',{html:"<b>Qui joue ?</b> Choisis ton prénom pour garder tes étoiles et reprendre ici la prochaine fois."}),
      h('div',{class:'chips', role:'group', 'aria-label':'Choisis ton prénom'}, PLAYERS.map(pl => h('button',{class:'chip', type:'button', onclick:() => {
        Store.setCurrent(pl.id); const p = Store.player(); p.lesson = l.id; p.scroll = Math.round(window.scrollY); Store.save();
        pendingResume = true; show(l.id);
      }}, pl.name)))));
  }
  view.replaceChildren(el);
  if (isLocked(l)){
    const box = h('div',{class:'lockbox'},
      h('h2',{class:'h2'}, 'Cette étape est fermée'),
      h('p',{html:"Pour l'ouvrir, réussis d'abord <b>le défi des multiplications</b>, à la fin de l'étape 7 : 3 flashs d'affilée de 5 nombres à 2 chiffres, avec des additions et des soustractions."}),
      h('p',{class:'muted'}, "C'est comme dans les écoles d'Asie : on ne commence à multiplier qu'une fois qu'on sait calculer de tête avec des nombres à 2 chiffres."),
      h('div',{class:'btns'}, h('button',{class:'btn primary', type:'button', onclick:goDefi}, 'Aller au défi')));
    box.insertAdjacentHTML('afterbegin', LOCK_SVG);
    el.append(box);
  } else {
    l.render(el, nextFn);
  }
  el.append(h('div',{class:'lesson-foot'},
    i>0 ? h('button',{class:'btn', type:'button', onclick:() => go(LESSONS[i-1].id)}, `← ${LESSONS[i-1].title}`) : h('span'),
    nextL ? h('button',{class:'btn primary', type:'button', onclick:nextFn}, `${nextL.title} →`) : h('button',{class:'btn primary', type:'button', onclick:() => go('home')}, "Retour à l'accueil")));
  curLessonId = null;
}
function restoreScroll(y){
  suppressScrollSave = true;
  window.scrollTo(0, y);
  const again = () => { window.scrollTo(0, y); setTimeout(() => { suppressScrollSave = false; }, 150); };
  const ready = document.fonts && document.fonts.ready ? document.fonts.ready : Promise.resolve();
  ready.then(() => requestAnimationFrame(again), () => requestAnimationFrame(again));
}
function show(route){
  activeKeypad = null;
  const resume = pendingResume; pendingResume = false;
  const l = LESSONS.find(x => x.id === route);
  if (l){
    const p = Store.player();
    const y = resume && p && p.lesson===l.id ? (p.scroll || 0) : 0;
    if (p && p.lesson !== l.id){ p.lesson = l.id; p.scroll = 0; Store.save(); }
    renderLesson(l); refreshTotal();
    const anchor = pendingAnchor && document.getElementById(pendingAnchor); pendingAnchor = null;
    if (anchor){ suppressScrollSave = true; anchor.scrollIntoView({block:'start'}); setTimeout(() => { suppressScrollSave = false; }, 300); }
    else restoreScroll(y);
  } else if (route === 'ouvrir-les-etapes'){
    /* Ouverture parent : #ouvrir-les-etapes ouvre les étapes 8 et 9 pour le joueur choisi */
    const d = Store.cur() ? Store.defi() : null;
    if (d){ d.done = true; Store.save(); }
    location.hash = '';
  } else {
    renderHome(); refreshTotal(); window.scrollTo(0,0);
  }
}
function go(route){
  const target = route==='home' ? '' : route;
  if (location.hash.slice(1) === target) show(route);
  else location.hash = target;
}
window.addEventListener('scroll', () => {
  if (scrollTimer) return;
  scrollTimer = setTimeout(() => {
    scrollTimer = null;
    if (suppressScrollSave) return;
    const id = location.hash.slice(1), p = Store.cur() ? Store.player() : null;
    if (p && p.lesson === id){ p.scroll = Math.round(window.scrollY); Store.save(); }
  }, 400);
}, {passive:true});
window.addEventListener('hashchange', () => show(location.hash.slice(1) || 'home'));
$('#brand').addEventListener('click', () => go('home'));
show(location.hash.slice(1) || 'home');
</script>
